# we use TopologySpreadConstraint to spread the pods across nodes and zones for High Availability

# When both constraints  topologyKey: topology.kubernetes.io/zone ,whenUnsatisfiable: DoNotSchedule and topologyKey: kubernetes.io/hostname, 
# whenUnsatisfiable:  DoNotSchedule  are set to DoNotSchedule with maxSkew: 1, the number of worker nodes across all Availability Zones must
# be equal/symmetric to avoid deadlocks.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 6 # replica count = node count * 2 , always maintain like this, replica COUNT be like 2 ,4 ,6 ,8 even numbers,
  selector:                                                                # then PODs will distibute equally between the nodes and zones 
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  # Pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      topologySpreadConstraints:
      # 1. Distribute equally across Availability Zones
      - maxSkew: 1             # maxSkew set the Pod difference between the NODES 
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            project: roboshop

      # 2. Distribute equally across individual Nodes
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable:  DoNotSchedule #ScheduleAnyway #
        labelSelector:
          matchLabels:
            project: roboshop
      
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
spec:
  minAvailable: "50%"
  selector:
    matchLabels:
      project: roboshop

# voluntary situations like upgrading eks cluster cordon and drain, autoscaling situations we can save pods for HA using PodDisruptionBudget

# we always need min availability for our application to work even in upgrade situations
