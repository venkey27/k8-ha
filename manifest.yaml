# we use TopologySpreadConstraint to spread the pods across nodes and zones for High Availability

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 2 # replica count = node count * 2 , always maintain like this, replica COUNT be like 2 ,4 ,6 ,8 even numbers,
  selector:                                                                # then PODs will distibute equally between the nodes and zones 
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  # Pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      topologySpreadConstraints:
      # 1. Distribute equally across Availability Zones
      - maxSkew: 1             # maxSkew set the Pod difference between the NODES 
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            project: roboshop

      # 2. Distribute equally across individual Nodes
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/node
        whenUnsatisfiable: DoNotSchedule #ScheduleAnyway
        labelSelector:
          matchLabels:
            project: roboshop
      
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80